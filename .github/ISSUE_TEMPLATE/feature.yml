name: Feature
description: A new layout, theme, or Action input
title: "[enhancement] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - layout
        - theme
        - svg
        - github-action
        - pages
        - documentation
        - other
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: What to add
    validations:
      required: true
  - type: markdown
    attributes:
      value: Search existing issues first. One concern per request.
