name: Contributors

# Refreshes the live demo (py-harness faces) and this repository's own wall.
# Protected main refuses a GITHUB_TOKEN push, so the refresh is a PR.

on:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fill.py"
      - "action.yml"
      - "README.md"
      - ".github/workflows/contributors.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Live demo from py-harness
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: YauhenBichel/py-harness
          format: html
          marker-start: "<!-- demo: live -start -->"
          marker-end: "<!-- demo: live -end -->"

      - name: This repository
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: html

      - name: Offer the refresh as a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/faces
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh live demo and contributors"
          git checkout -B docs/contributors
          git push --force --set-upstream origin docs/contributors
          NUMBER="$(gh pr list --head docs/contributors --state open --json number -q '.[0].number')"
          if [ -z "$NUMBER" ]; then
            if ! gh pr create --base "$DEFAULT_BRANCH" --head docs/contributors \
              --title "docs: refresh live demo and contributors" \
              --body "Filled from the GitHub contributors API, bots omitted. Opened because main takes changes only through a pull request."; then
              echo "Actions cannot open a pull request in this repository."
              echo "Open https://github.com/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...docs/contributors?expand=1"
            fi
          fi
