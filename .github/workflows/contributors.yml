name: Contributors

# Refreshes the live demo (py-harness faces) and this repository's own wall.

on:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fill.py"
      - "action.yml"
      - "README.md"
      - ".github/workflows/contributors.yml"

permissions:
  contents: write

jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Live demo from py-harness
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: YauhenBichel/py-harness
          svg: docs/demo.svg
          marker-start: "<!-- demo: live -start -->"
          marker-end: "<!-- demo: live -end -->"

      - name: This repository
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          svg: .github/contributors.svg

      - name: Push if the wall changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/demo.svg .github/contributors.svg
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh live demo and contributors"
          git push
