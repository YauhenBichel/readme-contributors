name: Contributors

# Refreshes the live demo (py-harness faces) and this repository's own
# wall, then merges the pull request so main updates by itself.
# Needs Settings → Actions → General → Allow GitHub Actions to create
# and approve pull requests.

on:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fill.py"
      - "action.yml"
      - "README.md"
      - ".github/workflows/contributors.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Live demo from py-harness
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: YauhenBichel/py-harness
          format: html
          caption: auto
          model: gpt-4o-mini
          model-api-key: ${{ secrets.OPENAI_API_KEY }}
          marker-start: "<!-- demo: live -start -->"
          marker-end: "<!-- demo: live -end -->"
          # Its own folder. The next step renders this repository's own wall and
          # deletes faces for logins that are not on it, which would take the
          # demo's faces with them.
          faces: docs/faces

      - name: This repository
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: html
          exclude: ghost
          caption: auto
          model: gpt-4o-mini
          model-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Land the refresh on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/faces docs/faces
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh live demo and contributors"
          git checkout -B docs/contributors
          git push --force --set-upstream origin docs/contributors
          NUMBER="$(gh pr list --head docs/contributors --state open --json number -q '.[0].number')"
          if [ -z "$NUMBER" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head docs/contributors \
              --title "docs: refresh live demo and contributors" \
              --body "Filled by this Action so the wall stays current."
            NUMBER="$(gh pr list --head docs/contributors --state open --json number -q '.[0].number')"
          fi
          # --auto needs Settings → Pull requests → Allow auto-merge.
          # This repo may not have that, so fall back to a squash now.
          gh pr merge "$NUMBER" --squash --auto || gh pr merge "$NUMBER" --squash
