name: Contributors

# Refreshes the live demo (py-harness faces) and this repository's own
# wall, and commits both straight to main — no separate pull request. It
# used to open one and auto-merge it, which needed Actions to be allowed to
# create pull requests and put a bot PR in the history for every refresh.
#
# main is protected, so the push goes through a write deploy key,
# CONTRIBUTORS_DEPLOY_KEY, the one bypass actor on the main ruleset besides
# the owner. A deploy-key push starts workflows, so the commit carries the
# skip-ci marker.

on:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fill.py"
      - "action.yml"
      - "README.md"
      - ".github/workflows/contributors.yml"

# The push uses the deploy key; the token only reads the contributors API.
permissions:
  contents: read

jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.CONTRIBUTORS_DEPLOY_KEY }}
          persist-credentials: true

      - name: Live demo from py-harness
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: YauhenBichel/py-harness
          format: html
          caption: auto
          model: gpt-4o-mini
          model-api-key: ${{ secrets.OPENAI_API_KEY }}
          marker-start: "<!-- demo: live -start -->"
          marker-end: "<!-- demo: live -end -->"
          # Its own folder. The next step renders this repository's own wall and
          # deletes faces for logins that are not on it, which would take the
          # demo's faces with them.
          faces: docs/faces

      - name: This repository
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: html
          exclude: ghost
          caption: auto
          model: gpt-4o-mini
          model-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit the refresh to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/faces docs/faces
          if git diff --cached --quiet; then
            echo "The demo and the wall already match the contributors API."
            exit 0
          fi
          git commit -m "docs: refresh live demo and contributors [skip ci]"
          # main can move while this runs; the commit only touches the walls,
          # which were just recomputed, so replaying it on the new tip is safe.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort || true; echo "::error::main changed the wall files while this ran; the next run will recompute them."; exit 1; }
          done
          echo "::error::Could not push to main. Check CONTRIBUTORS_DEPLOY_KEY is a write deploy key and that deploy keys may bypass the main ruleset."
          exit 1
