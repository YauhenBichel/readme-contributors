name: CI

on:
  push:
    branches: [main]
  pull_request:

# A bare push plus pull_request ran this twice on the same commit for every
# push to a branch with a pull request open. Restricting push to main leaves
# one run per change.
#
# Cancelling applies to pull requests only, so a push to main is never killed
# part-way through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m unittest discover -s tests -q
