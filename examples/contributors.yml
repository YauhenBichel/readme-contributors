# Drop-in workflow for a repository that already has the README markers:
#
#   <!-- readme: contributors,bots/- -start -->
#   <!-- readme: contributors,bots/- -end -->
#
# Opens a pull request on a protected default branch instead of pushing.
# Needs Settings → Actions → General → Allow GitHub Actions to create
# and approve pull requests.
# Pin the Action to a commit SHA when the job has contents: write.
# Unprotected default branches can `git push` instead — see the Pages
# how-to. Do not enable caption: auto on push to README.md.

name: Contributors

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: YauhenBichel/readme-contributors@v1.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # layout: tiles
          # theme: midnight
          # exclude: ghost
          # caption: auto

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/contributors.svg .github/faces
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh README contributors"
          git checkout -B docs/contributors
          git push --force --set-upstream origin docs/contributors
          NUMBER="$(gh pr list --head docs/contributors --state open --json number -q '.[0].number')"
          if [ -z "$NUMBER" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head docs/contributors \
              --title "docs: refresh README contributors" \
              --body "Filled by this Action so the wall stays current."
            NUMBER="$(gh pr list --head docs/contributors --state open --json number -q '.[0].number')"
          fi
          gh pr merge "$NUMBER" --squash --auto || gh pr merge "$NUMBER" --squash
