# Drop-in workflow for a repository that already has the README markers:
#
#   <!-- readme: contributors,bots/- -start -->
#   <!-- readme: contributors,bots/- -end -->
#
# Save as .github/workflows/contributors.yml. It calls the reusable wall,
# which writes the refreshed wall straight to the default branch after every
# merge — no separate pull request, and no bot PR in the history.
#
# Unprotected default branch: nothing else to do.
#
# Protected default branch: add a write deploy key to the repository, store
# its private half as the secret CONTRIBUTORS_DEPLOY_KEY, and let deploy keys
# bypass the branch ruleset. `secrets: inherit` hands it to the wall — but only
# when this repository is in the same organisation or account as the workflow.
# Anywhere else, replace `secrets: inherit` with:
#
#   secrets:
#     CONTRIBUTORS_DEPLOY_KEY: ${{ secrets.CONTRIBUTORS_DEPLOY_KEY }}
#
# Do not add a pull_request trigger. A wall drawn on a pull request branch is
# stale by the time it merges if anything else merged first, and a fork's pull
# request cannot run it at all; the reusable wall skips pull request events.

name: Contributors

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wall:
    uses: YauhenBichel/readme-contributors/.github/workflows/wall.yml@v1
    secrets: inherit
