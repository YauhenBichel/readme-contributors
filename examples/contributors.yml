# Drop-in workflow for a repository that already has the README markers:
#
#   <!-- readme: contributors,bots/- -start -->
#   <!-- readme: contributors,bots/- -end -->
#
# Pin the Action to a commit SHA when the job has contents: write.
# Protected default branches should open a pull request instead of pushing
# (see the py-harness contributors.yml pattern).

name: Contributors

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: YauhenBichel/readme-contributors@v1.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # layout: tiles
          # theme: midnight
          # exclude: ghost
          # caption: auto

      - name: Push the list
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/contributors.svg .github/faces
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh README contributors"
          git push
