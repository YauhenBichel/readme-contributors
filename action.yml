name: README contributors
description: >
  Fill a README with clickable polaroid stickers from the GitHub
  contributors API. Bots omitted. No third-party list service.
author: readme-contributors
branding:
  icon: users
  color: purple

inputs:
  readme:
    description: Markdown file that contains the contributor markers
    default: README.md
  svg:
    description: Where to write the generated SVG wall (format=svg)
    default: .github/contributors.svg
  format:
    description: svg (wall file plus clickable README stickers) or html (stickers only)
    default: svg
  layout:
    description: >
      Wall layout. auto (default) picks facepile (≤8), grid (≤24), or
      compact. Or set facepile, stickers, grid, tiles, list, compact,
      wave, orbit, honeycomb, ribbon, constellation, banner.
    default: auto
  theme:
    description: >
      Color theme. One of auto (default), github, midnight, sunrise,
      forest, ocean, mono.
    default: auto
  columns:
    description: Faces per row
    default: "8"
  faces:
    description: Folder of one polaroid SVG per person (README icons)
    default: .github/faces
  avatar-size:
    description: Face diameter in pixels
    default: "72"
  max:
    description: >
      Maximum people to draw (API order, bots already omitted). 0 means
      500. Default 100 so a mid-size repo still lists everyone.
    default: "100"
  exclude:
    description: >
      Comma-separated GitHub logins to omit after bots are filtered.
      Case-insensitive.
    required: false
    default: ""
  caption:
    description: >
      Optional line under the wall. Empty (default) writes none. auto
      writes one muted sentence when a model key is set. Any other
      value is used as-is.
    required: false
    default: ""
  model:
    description: >
      Optional chat model for caption=auto. Empty skips the model.
      Set github to use GitHub Models with GITHUB_TOKEN.
    required: false
    default: ""
  model-api-key:
    description: Optional API key for an OpenAI-compatible chat endpoint.
    required: false
    default: ""
  model-base-url:
    description: Optional OpenAI-compatible API root (no /chat/completions).
    required: false
    default: ""
  repository:
    description: owner/name to read contributors from
    default: ${{ github.repository }}
  token:
    description: Token for the GitHub API (raises the rate limit)
    default: ${{ github.token }}
  check:
    description: If true, exit 1 when the README or SVG would change
    default: "false"
  marker-start:
    description: Inclusive start marker in the markdown file
    default: "<!-- readme: contributors,bots/- -start -->"
  marker-end:
    description: Inclusive end marker in the markdown file
    default: "<!-- readme: contributors,bots/- -end -->"

outputs:
  count:
    description: Number of people written
    value: ${{ steps.fill.outputs.count }}
  changed:
    description: true when the README or SVG was rewritten
    value: ${{ steps.fill.outputs.changed }}

runs:
  using: composite
  steps:
    - id: fill
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ inputs.repository }}
        CONTRIBUTORS_REPO: ${{ inputs.repository }}
        README_PATH: ${{ inputs.readme }}
        SVG_PATH: ${{ inputs.svg }}
        FACES_PATH: ${{ inputs.faces }}
        FORMAT: ${{ inputs.format }}
        LAYOUT: ${{ inputs.layout }}
        THEME: ${{ inputs.theme }}
        COLUMNS: ${{ inputs.columns }}
        AVATAR_SIZE: ${{ inputs.avatar-size }}
        MAX_PEOPLE: ${{ inputs.max }}
        EXCLUDE: ${{ inputs.exclude }}
        CAPTION: ${{ inputs.caption }}
        MODEL: ${{ inputs.model }}
        MODEL_API_KEY: ${{ inputs.model-api-key }}
        MODEL_BASE_URL: ${{ inputs.model-base-url }}
        CHECK: ${{ inputs.check }}
        MARKER_START: ${{ inputs.marker-start }}
        MARKER_END: ${{ inputs.marker-end }}
      run: python3 "$GITHUB_ACTION_PATH/fill.py"
